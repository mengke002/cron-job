# .github/workflows/keep-alive.yml

name: Keep Service Alive

on:
  schedule:
    # 每 5 分钟运行一次
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 第一个请求：保持服务唤醒
      - name: Send GET request to the service root
        # 使用 curl 发送一个 GET 请求。--fail 会在服务器返回非 2xx 状态码时让 job 失败。
        # || exit 0 的作用是：即使 curl 失败了，也让这一步成功，避免整个 workflow 失败。
        run: curl --fail https://gemini-balance-wlqs.onrender.com || exit 0

      # 第二个请求：调用 models API (使用 Secret)
      - name: Send GET request to the models endpoint
        env:
          # 将 secret 导入到环境变量中，这样在 run 命令里更干净
          API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X GET --fail "https://gemini-balance-wlqs.onrender.com/v1/models" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" || exit 0
