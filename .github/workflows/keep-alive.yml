# .github/workflows/keep-alive.yml

name: Request Render Service

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 第一个请求：保持服务唤醒
      - name: Send GET request to the gemini balance service
        run: |
          curl --location --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
            --fail https://gemini-balance-wlqs.onrender.com || exit 0

      # 第二个请求：保持服务唤醒
      - name: Send GET request to the one api service
        run: |
          curl --location --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
            --fail https://one-api-6w3d.onrender.com || exit 0

      # 第三个请求：调用 models API (使用 Secret)
      - name: Send GET request to the models endpoint (gemini)
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X GET --location --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
            --fail "https://gemini-balance-wlqs.onrender.com/v1/models" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" || exit 0

      # 第四个请求：调用 models API (使用 Secret)
      - name: Send GET request to the models endpoint (one-api)
        env:
          AI_API_KEY: ${{ secrets.ONE_API_KEY }}
        run: |
          curl -X GET --location --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
            --fail "https://one-api-6w3d.onrender.com/v1/models" \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" || exit 0
